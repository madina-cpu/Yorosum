<!--
  Yorosum language switcher (Korean / English / Uzbek) for Cafe24.

  Where to paste: Cafe24 admin → 디자인 → 디자인 편집 → the header file of EACH
  language shop's skin (usually layout/basic/layout.html or header.html),
  wherever you want the buttons to appear (e.g. next to login / cart links).

  Shop addresses: Korean = yorosum.com, English = yorosum.com/en,
  Uzbek = yorosum.com/uz. The /en and /uz path prefixes are set in
  data-prefix below; change them there if your shop addresses differ.
-->
<div class="yr-lang" role="navigation" aria-label="Language">
  <a class="yr-lang__btn" href="https://yorosum.com/" data-prefix="" data-lang="ko" hreflang="ko" lang="ko">한국어</a>
  <a class="yr-lang__btn" href="https://yorosum.com/en/" data-prefix="/en" data-lang="en" hreflang="en" lang="en">English</a>
  <a class="yr-lang__btn" href="https://yorosum.com/uz/" data-prefix="/uz" data-lang="uz" hreflang="uz" lang="uz">O‘zbekcha</a>
</div>

<style>
  .yr-lang { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; line-height: 1; }
  .yr-lang__btn {
    display: inline-block; padding: 6px 10px; border: 1px solid #ddd; border-radius: 14px;
    color: #555; text-decoration: none; background: #fff; white-space: nowrap;
  }
  .yr-lang__btn:hover { border-color: #333; color: #111; }
  .yr-lang__btn.is-active { background: #111; border-color: #111; color: #fff; pointer-events: none; }
  @media (max-width: 640px) {
    .yr-lang__btn { padding: 5px 8px; font-size: 11px; }
  }
</style>

<script>
  // Highlight the button for the shop the visitor is currently on, and keep
  // them on the same page path when they switch (e.g. a product page).
  (function () {
    var links = document.querySelectorAll('.yr-lang__btn');
    var path = location.pathname;
    var current = null;
    // Find which shop we're on: the longest prefix that matches the path.
    for (var i = 0; i < links.length; i++) {
      var prefix = links[i].getAttribute('data-prefix');
      if ((prefix === '' || path === prefix || path.indexOf(prefix + '/') === 0) &&
          (current === null || prefix.length > current.getAttribute('data-prefix').length)) {
        current = links[i];
      }
    }
    if (!current) return;
    // The page path without the language prefix, e.g. /product/detail.html
    var rest = path.slice(current.getAttribute('data-prefix').length) || '/';
    for (var j = 0; j < links.length; j++) {
      if (links[j] === current) {
        links[j].classList.add('is-active');
        links[j].setAttribute('aria-current', 'true');
      } else {
        // Same page + query on the other shop. Products share IDs across
        // Cafe24 multi-shops, so /product/detail.html?product_no=12 still works.
        links[j].href = location.origin + links[j].getAttribute('data-prefix') + rest + location.search;
      }
    }
  })();
</script>
